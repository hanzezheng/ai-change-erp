spring:
  application:
    name: nongpi-backend
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.nongpi.assistant: INFO

app:
  # 租户与 ERP 连接暂由服务端配置提供。
  # Phase 2 引入 PostgreSQL 后，由数据库实现替换 ConfiguredTenantResolver /
  # ConfiguredErpConnectionProvider，接口不变。
