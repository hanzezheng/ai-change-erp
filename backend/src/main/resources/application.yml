spring:
  application:
    name: nongpi-backend
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nongpi}
    username: ${DATABASE_USERNAME:nongpi}
    password: ${DATABASE_PASSWORD:nongpi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.nongpi.assistant: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  credential-encryption:
    key: ${APP_CREDENTIAL_ENCRYPTION_KEY}
