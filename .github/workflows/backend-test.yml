name: backend-test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests
        run: ./mvnw -B test
        env:
          # 测试通过 Testcontainers 启动 PostgreSQL，不连接真实 ERPNext，不注入 ERP 凭据。
          APP_JWT_SECRET: ci-only-jwt-hmac-secret-key-32bytes
          APP_CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-master-key-32
          DOCKER_API_VERSION: "1.44"
