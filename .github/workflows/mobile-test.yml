name: Mobile Tests

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-test.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
